name: ESP32 end-to-end

# Builds the patched esp32sim runtime, compiles the Blink sketch with the real Arduino-ESP32 toolchain
# and runs it in the emulator, asserting real GPIO edges and serial output. This is the evidence that
# a chip works; a chip is only advertised as supported once its job here is green.
on:
  pull_request:
    paths:
      - "esp32-runtime/**"
      - "scripts/esp32/**"
      - "examples/esp32/**"
      - ".github/workflows/esp32-e2e.yml"
  workflow_dispatch:

jobs:
  blink:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - { chip: esp32,   fqbn: "esp32:esp32:esp32" }
          - { chip: esp32c3, fqbn: "esp32:esp32:esp32c3" }
          - { chip: esp32s3, fqbn: "esp32:esp32:esp32s3" }
          - { chip: esp32c6, fqbn: "esp32:esp32:esp32c6" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: wasm32-unknown-unknown }
      - name: Build patched runtime
        run: scripts/esp32/build-runtime.sh "$RUNNER_TEMP/runtime"
      - uses: arduino/setup-arduino-cli@v2
      - name: Install the ESP32 core
        env:
          URL: https://espressif.github.io/arduino-esp32/package_esp32_index.json
        run: |
          arduino-cli version
          arduino-cli core update-index --additional-urls "$URL" || { echo "::error::core update-index failed"; exit 1; }
          arduino-cli core install esp32:esp32 --additional-urls "$URL" || { echo "::error::core install failed"; exit 1; }
      - name: Compile Blink
        run: |
          arduino-cli compile --fqbn "${{ matrix.fqbn }}" --output-dir "$RUNNER_TEMP/fw" examples/esp32/blink || { echo "::error::arduino-cli compile failed"; exit 1; }
          ls -la "$RUNNER_TEMP/fw"
      - name: Run in emulator and assert GPIO
        run: |
          node scripts/esp32/e2e-blink.mjs --chip ${{ matrix.chip }} --runtime "$RUNNER_TEMP/runtime" --fw "$RUNNER_TEMP/fw" 2>&1 | tee "$RUNNER_TEMP/e2e.log" || { echo "::error::$(tail -c 600 "$RUNNER_TEMP/e2e.log" | tr '\n' ' ')"; exit 1; }
